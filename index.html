```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>
  <style>
    :root {
      --cream: #fff8e7;
      --cream-dark: #fff0c7;
      --yellow: #ffd85c;
      --yellow-dark: #f2b928;
      --brown: #5c4525;
      --text: #3f321f;
      --white: #fffdf7;
      --shadow: 0 12px 30px rgba(112, 78, 20, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #fff1a8 0 7%, transparent 7.5%),
        radial-gradient(circle at 90% 15%, #ffe8a3 0 6%, transparent 6.5%),
        var(--cream);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .container {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 8px 15px;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--brown);
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.15;
      letter-spacing: -2px;
    }

    .subtitle {
      margin: 14px 0 0;
      color: #806a46;
      font-size: clamp(17px, 3vw, 21px);
      line-height: 1.6;
    }

    .panel {
      background: rgba(255, 253, 247, 0.9);
      border: 2px solid #f7df9b;
      border-radius: 28px;
      padding: clamp(22px, 5vw, 38px);
      box-shadow: var(--shadow);
    }

    .question {
      text-align: center;
      margin-bottom: 25px;
    }

    .question h2 {
      margin: 0 0 8px;
      font-size: clamp(24px, 5vw, 32px);
    }

    .question p {
      margin: 0;
      color: #806a46;
      font-size: 16px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .mbti-btn {
      border: 2px solid #f2d58a;
      background: #fffaf0;
      color: var(--brown);
      border-radius: 16px;
      padding: 17px 8px;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s, background .15s, border-color .15s;
    }

    .mbti-btn:hover,
    .mbti-btn:focus-visible {
      transform: translateY(-3px);
      background: #fff0b9;
      border-color: var(--yellow-dark);
      outline: none;
    }

    .result {
      display: none;
      text-align: center;
    }

    .result.show {
      display: block;
    }

    .result-type {
      display: inline-block;
      background: var(--yellow);
      color: var(--brown);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .pokemon-emoji {
      font-size: clamp(90px, 20vw, 150px);
      line-height: 1;
      margin: 8px 0 15px;
      filter: drop-shadow(0 8px 8px rgba(90, 60, 10, .12));
    }

    .pokemon-name {
      margin: 0;
      font-size: clamp(36px, 8vw, 54px);
      letter-spacing: -2px;
    }

    .reason {
      max-width: 620px;
      margin: 18px auto 25px;
      padding: 20px;
      background: #fff5d5;
      border-radius: 18px;
      font-size: 18px;
      line-height: 1.8;
    }

    .match {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fffdf7;
      border: 2px solid #efd27d;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: 800;
    }

    .match strong {
      color: #b77a00;
      font-size: 21px;
    }

    .again {
      display: block;
      margin: 28px auto 0;
      border: 0;
      background: var(--brown);
      color: white;
      border-radius: 16px;
      padding: 15px 27px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    .again:hover,
    .again:focus-visible {
      transform: translateY(-2px);
      background: #76582f;
      outline: none;
    }

    .tip {
      text-align: center;
      margin-top: 18px;
      color: #987d50;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 20px, 900px);
        padding-top: 28px;
      }

      .panel {
        border-radius: 22px;
        padding: 20px 15px;
      }

      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .mbti-btn {
        padding: 16px 8px;
      }

      .reason {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="badge">✨ 나와 닮은 포켓몬은?</div>
      <h1>MBTI로 포켓몬 찾기</h1>
      <p class="subtitle">
        내 MBTI를 고르면<br>
        가장 어울리는 포켓몬을 찾아드려요!
      </p>
    </header>

    <section class="panel">
      <div id="selection">
        <div class="question">
          <h2>당신의 MBTI는?</h2>
          <p>아래에서 하나를 골라보세요 🐾</p>
        </div>

        <div class="mbti-grid" id="mbtiGrid"></div>

        <div class="tip">※ 재미로 즐기는 성격 유형 테스트예요!</div>
      </div>

      <div id="result" class="result">
        <div class="result-type" id="resultType"></div>
        <div class="pokemon-emoji" id="pokemonEmoji"></div>
        <h2 class="pokemon-name" id="pokemonName"></h2>

        <div class="reason" id="reason"></div>

        <div class="match">
          💛 잘 맞는 유형:
          <strong id="matchType"></strong>
        </div>

        <button class="again" id="againBtn">↩ 다시 고르기</button>
      </div>
    </section>
  </main>

  <script>
    const pokemonData = {
      ISTJ: {
        pokemon: "메타몽",
        emoji: "🩷",
        reason: "차분하게 상황을 살피고 맡은 일을 꾸준히 해내는 타입이에요.<br>겉으로는 조용하지만 필요할 때는 확실하게 자기 역할을 합니다.",
        match: "ESFP"
      },
      ISFJ: {
        pokemon: "이브이",
        emoji: "🦊",
        reason: "따뜻하고 다정하며 주변 사람을 세심하게 챙기는 모습이 이브이와 닮았어요.<br>편안한 관계 속에서 자신의 매력을 자연스럽게 보여줍니다.",
        match: "ESTP"
      },
      INFJ: {
        pokemon: "가디안",
        emoji: "🧚",
        reason: "깊은 생각과 강한 공감 능력을 가진 이상주의자예요.<br>소중한 사람을 지키기 위해서는 놀라운 힘도 보여주는 타입입니다.",
        match: "ENFP"
      },
      INTJ: {
        pokemon: "뮤츠",
        emoji: "🧬",
        reason: "혼자서도 깊이 생각하고 목표를 향해 전략적으로 움직이는 타입이에요.<br>자신만의 기준과 논리로 세상을 바라보는 모습이 뮤츠와 닮았습니다.",
        match: "ENTP"
      },
      ISTP: {
        pokemon: "에이스번",
        emoji: "🐰",
        reason: "필요한 순간에 빠르게 움직이고 직접 해결하는 실전형이에요.<br>자유로운 방식으로 자신의 능력을 발휘하는 모습이 잘 어울립니다.",
        match: "ESFJ"
      },
      ISFP: {
        pokemon: "치라치노",
        emoji: "🐭",
        reason: "부드럽고 감각적이며 자신만의 아름다움을 중요하게 생각하는 타입이에요.<br>조용하지만 좋아하는 것에는 진심을 다하는 모습이 매력적입니다.",
        match: "ESTJ"
      },
      INFP: {
        pokemon: "토게피",
        emoji: "🥚",
        reason: "순수한 마음과 풍부한 상상력을 가진 이상주의자예요.<br>작은 행복과 따뜻한 관계를 소중하게 여기는 모습이 토게피와 닮았습니다.",
        match: "ENFJ"
      },
      INTP: {
        pokemon: "폴리곤",
        emoji: "🔺",
        reason: "호기심이 많고 복잡한 것을 파고드는 탐구형이에요.<br>남들이 당연하게 생각하는 것도 자기만의 방식으로 분석하는 타입입니다.",
        match: "ENTJ"
      },
      ESTP: {
        pokemon: "루카리오",
        emoji: "🐺",
        reason: "행동력이 뛰어나고 눈앞의 상황에 빠르게 대응하는 타입이에요.<br>실전 감각이 좋고 승부의 순간에는 과감하게 움직입니다.",
        match: "ISFJ"
      },
      ESFP: {
        pokemon: "피카츄",
        emoji: "⚡",
        reason: "밝고 에너지가 넘치며 주변 사람들에게 즐거움을 주는 타입이에요.<br>친구들과 함께할 때 더욱 빛나는 모습이 피카츄와 찰떡입니다.",
        match: "ISTJ"
      },
      ENFP: {
        pokemon: "마릴",
        emoji: "🔵",
        reason: "호기심이 많고 긍정적인 에너지로 새로운 것을 즐기는 타입이에요.<br>친구들과 함께 신나게 모험하는 것을 좋아하는 모습이 잘 어울립니다.",
        match: "INFJ"
      },
      ENTP: {
        pokemon: "후딘",
        emoji: "🥄",
        reason: "아이디어가 풍부하고 기존의 방식에 얽매이지 않는 발명가 타입이에요.<br>새로운 가능성을 발견하면 끝까지 파고드는 지적인 매력이 있습니다.",
        match: "INTJ"
      },
      ESTJ: {
        pokemon: "괴력몬",
        emoji: "💪",
        reason: "목표가 분명하고 책임감 있게 일을 추진하는 리더형이에요.<br>필요한 일을 확실하게 해내며 주변을 이끄는 힘이 있습니다.",
        match: "ISFP"
      },
      ESFJ: {
        pokemon: "가디",
        emoji: "🐶",
        reason: "사람들과 잘 어울리고 주변을 든든하게 챙기는 타입이에요.<br>친근하고 충성심이 강해서 함께 있으면 마음이 편안해집니다.",
        match: "ISTP"
      },
      ENFJ: {
        pokemon: "님피아",
        emoji: "🎀",
        reason: "사람의 마음을 잘 이해하고 따뜻하게 이끄는 타입이에요.<br>좋은 관계를 만들고 주변 사람에게 긍정적인 영향을 주는 모습이 닮았습니다.",
        match: "INFP"
      },
      ENTJ: {
        pokemon: "레쿠쟈",
        emoji: "🐉",
        reason: "큰 목표를 세우고 자신 있게 앞으로 나아가는 강력한 리더형이에요.<br>어려운 상황에서도 방향을 잃지 않고 문제를 해결하는 힘이 있습니다.",
        match: "INTP"
      }
    };

    const mbtiTypes = [
      "ISTJ", "ISFJ", "INFJ", "INTJ",
      "ISTP", "ISFP", "INFP", "INTP",
      "ESTP", "ESFP", "ENFP", "ENTP",
      "ESTJ", "ESFJ", "ENFJ", "ENTJ"
    ];

    const mbtiGrid = document.getElementById("mbtiGrid");
    const selection = document.getElementById("selection");
    const result = document.getElementById("result");

    mbtiTypes.forEach(type => {
      const button = document.createElement("button");
      button.className = "mbti-btn";
      button.textContent = type;
      button.setAttribute("aria-label", `${type} 선택`);

      button.addEventListener("click", () => showResult(type));
      mbtiGrid.appendChild(button);
    });

    function showResult(type) {
      const data = pokemonData[type];

      document.getElementById("resultType").textContent = `${type}에게 어울리는 포켓몬`;
      document.getElementById("pokemonEmoji").textContent = data.emoji;
      document.getElementById("pokemonName").textContent = data.pokemon;
      document.getElementById("reason").innerHTML = data.reason;
      document.getElementById("matchType").textContent = data.match;

      selection.style.display = "none";
      result.classList.add("show");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    document.getElementById("againBtn").addEventListener("click", () => {
      result.classList.remove("show");
      selection.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
